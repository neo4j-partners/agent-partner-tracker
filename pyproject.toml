[project]
name = "partner-content-tracker"
version = "0.1.0"
description = "Track and publish Neo4j partner integration content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2==3.1.6",
]

[project.scripts]
build-site = "agent_tracker.build_site:main"
check-partner-repositories = "agent_tracker.check_partner_repositories:main"
discover-partner-content = "agent_tracker.discover_partner_content:main"
partner-tracker = "agent_tracker.partner_tracker:main"
validate-site = "agent_tracker.validate_site:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tracker"]

name: Publish partner tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Verify database integrity
        run: sqlite3 partner-tracking.db "PRAGMA integrity_check; PRAGMA foreign_key_check;"

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build static site
        run: uv run --locked build-site --db partner-tracking.db --output _site

      - name: Validate generated links
        run: uv run --locked validate-site _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy static site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
